# ===============================================
# HIGH-VOLUME SCRAPER CONFIGURATION
# Target: 10 Lakh (1 Million) High-Quality Contacts
# ===============================================

database:
  host: localhost
  port: 5432
  name: scraper_db
  user: postgres
  password: your_password_here

proxy:
  # ARCHITECTURE CHANGE: Paid proxies are removed.
  # System now uses Direct Stealth Fetching with human-like delays.
  enable_city_targeting: false
  
scraper_settings:
  # Direct fetching requires higher politeness to avoid IP blocks.
  force_http1_sources: ["JUSTDIAL", "TRADEINDIA", "INDIAMART", "AMFI"]
  max_retries: 5
  timeout: 60
  request_delay_min: 8
  request_delay_max: 25
  max_concurrent: 1
  max_pages_per_source: 3

distributed:
  batch_size: 1000
  write_interval: 30
  task_queue: "scraper:tasks"
  result_buffer: "scraper:results_buffer"

